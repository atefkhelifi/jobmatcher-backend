spring:
  application:
    name: jobmatcher-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobmatcher}}
    username: ${DB_USER:jobmatcher}
    password: ${DB_PASSWORD:jobmatcher}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  session:
    timeout: 8h
  jackson:
    deserialization:
      # Jackson 3 rejects a missing primitive by default; here an omitted flag simply means false.
      fail-on-null-for-primitives: false

server:
  port: 8080
  # Behind the bundled nginx, which overwrites X-Forwarded-For. Do not expose the API port directly.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  crypto:
    # Base64-encoded 32-byte key (AES-256-GCM) protecting CV text at rest. No default on purpose.
    key: ${APP_ENCRYPTION_KEY}
  ai:
    # mock | ollama
    provider: ${AI_PROVIDER:ollama}
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen3:8b}
      timeout: 180s
  upload:
    max-bytes: 10485760
    max-text-chars: 200000
    parse-timeout: 30s
  fetch:
    # Outbound requests are limited to public addresses on ports 80/443. Only tests relax this.
    allow-private: false
    max-bytes: 5242880
    timeout: 15s
    min-interval: 1s
  jobs:
    scheduling-enabled: true
    # Greenhouse boards to read, comma separated (company board names). Empty disables the source.
    greenhouse-boards: ${APP_JOBS_GREENHOUSE_BOARDS:}
    # Keejob (Tunisia) is read from its public RSS feed. On by default.
    keejob:
      enabled: ${APP_JOBS_KEEJOB_ENABLED:true}
    # Tanitjobs (Tunisia) has no feed: pages are read one by one. Off by default, personal non-commercial use only (see docs/install.md).
    tanitjobs:
      enabled: ${APP_JOBS_TANITJOBS_ENABLED:false}
      max-offers: ${APP_JOBS_TANITJOBS_MAX_OFFERS:25}
    francetravail:
      client-id: ${APP_JOBS_FRANCETRAVAIL_CLIENT_ID:}
      client-secret: ${APP_JOBS_FRANCETRAVAIL_CLIENT_SECRET:}
  rate-limit:
    discovery-per-minute: 6
    login-per-minute: 10
    register-per-hour: 10
    upload-per-minute: 10
    analysis-per-minute: 10

springdoc:
  swagger-ui:
    path: /api/docs
  api-docs:
    path: /api/openapi
