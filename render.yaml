# Render Blueprint: New > Blueprint, pick this repo. Free tier, see docs/deploy-render.md.
databases:
  - name: jobmatcher-db
    plan: free
    databaseName: jobmatcher
    user: jobmatcher

services:
  - type: web
    name: jobmatcher-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase: { name: jobmatcher-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: jobmatcher-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: jobmatcher-db, property: database }
      - key: DB_USER
        fromDatabase: { name: jobmatcher-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: jobmatcher-db, property: password }
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: mock
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_JOBS_KEEJOB_ENABLED
        value: "true"
      - key: APP_JOBS_TANITJOBS_ENABLED
        value: "false"
      # The free instance has 512 MB: keep the heap small.
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx300m -XX:+UseSerialGC -XX:TieredStopAtLevel=1

  # Static site; /api/* is proxied to the API so the browser sees one origin (cookies keep working).
  - type: web
    name: jobmatcher-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npx ng build --configuration production
    staticPublishPath: dist/frontend/browser
    routes:
      - type: rewrite
        source: /api/*
        destination: https://jobmatcher-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
