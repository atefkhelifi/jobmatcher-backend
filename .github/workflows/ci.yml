name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers starts PostgreSQL; Docker is available on ubuntu-latest runners.
      - name: Unit and integration tests
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: atefkhelifi/jobmatcher-frontend
          path: frontend
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Unit tests
        working-directory: frontend
        run: npx ng test --watch=false
      - name: Production build
        working-directory: frontend
        run: npx ng build --configuration production

  license-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: atefkhelifi/jobmatcher-frontend
          path: frontend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: frontend
      - name: The gate itself rejects what it should
        run: python -I -m unittest discover -s scripts -p "test_*.py"
      - name: Check the license of every Maven and npm dependency
        run: python -I scripts/license-gate.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: atefkhelifi/jobmatcher-frontend
          path: frontend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check every Maven and npm dependency against OSV
        run: python3 scripts/audit-deps.py

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: atefkhelifi/jobmatcher-frontend
          path: frontend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Build the API jar
        working-directory: backend
        run: ./mvnw -B -DskipTests package
      - name: Build the web app
        working-directory: frontend
        run: npm ci && npx ng build --configuration production
      - name: Install browsers
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Definition-of-Done journey
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: atefkhelifi/jobmatcher-frontend
          path: frontend
      - name: Build the images and start the stack
        working-directory: infra
        env:
          DB_PASSWORD: ci-only-password
          APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          AI_PROVIDER: mock
        run: docker compose up --build -d
      - name: Wait for the web app and check the API answers through the proxy
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8088/api/status && exit 0
            sleep 3
          done
          docker compose -f infra/docker-compose.yml logs --tail=100
          exit 1
      - name: Stop
        if: always()
        working-directory: infra
        env:
          DB_PASSWORD: ci-only-password
          APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: docker compose down -v
